name: Publish TravelManager to GHCR
on:
  push:
    branches:
      - main
    paths:
      - 'Praktikum542/**'
      - '.github/workflows/travelmanager-ghcr.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore tests
        run: dotnet restore Praktikum542/Praktikum542.Tests/Praktikum542.Tests.csproj
      - name: Run unit tests
        run: dotnet test Praktikum542/Praktikum542.Tests/Praktikum542.Tests.csproj --no-restore --filter 'FullyQualifiedName~UnitTests'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Praktikum542
          file: ./Praktikum542/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
