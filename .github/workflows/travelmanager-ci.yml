name: TravelManager CI
on:
  pull_request:
    paths:
      - 'Praktikum542/**'
      - '.github/workflows/travelmanager-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'Praktikum542/**'
      - '.github/workflows/travelmanager-ci.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Praktikum542
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore test dependencies
        run: dotnet restore Praktikum542.Tests/Praktikum542.Tests.csproj
      - name: Run Unit tests
        run: dotnet test Praktikum542.Tests/Praktikum542.Tests.csproj --no-restore --filter 'FullyQualifiedName~UnitTests|FullyQualifiedName~MockingTests|FullyQualifiedName~ExceptionTests|FullyQualifiedName~ReliabilityTests' --logger 'console;verbosity=normal'
  docker-build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f Praktikum542/Dockerfile -t travelmanager:pr-check Praktikum542
