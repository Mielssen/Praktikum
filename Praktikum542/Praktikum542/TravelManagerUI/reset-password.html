<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum542 | Скидання паролю</title>
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>

<div class="navbar">
    <h2>Travel<span>Manager</span></h2>
</div>

<div class="reset-wrapper">
    <div class="reset-card">

        <div id="formState">
            <h3>Новий пароль</h3>
            <p class="reset-sub">Придумайте новий пароль для входу в акаунт</p>

            <label>Новий пароль</label>
            <input id="newPassword" type="password" placeholder="Мінімум 6 символів" autocomplete="new-password">

            <label>Підтвердження паролю</label>
            <input id="confirmPassword" type="password" placeholder="Повторіть пароль" autocomplete="new-password">

            <div id="errorBox" class="error-box hidden"></div>

            <button class="btn-save" id="submitBtn" onclick="submitReset()">Змінити пароль</button>
        </div>

        <div id="successState" class="hidden">
            <div class="status-icon success">✓</div>
            <h3>Пароль змінено</h3>
            <p class="reset-sub">Тепер можна увійти з новим паролем</p>
            <button class="btn-save" onclick="goToLogin()">Перейти до входу</button>
        </div>

        <div id="invalidState" class="hidden">
            <div class="status-icon error">✕</div>
            <h3>Посилання недійсне</h3>
            <p class="reset-sub">Термін дії посилання минув, або воно вже було використане. Запросіть скидання паролю ще раз.</p>
            <button class="btn-cancel" onclick="goToLogin()">На головну</button>
        </div>

    </div>
</div>

<script src="reset-password.js"></script>
</body>
</html>
